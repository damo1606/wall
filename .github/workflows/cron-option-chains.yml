name: Option chains (disparo manual)

# Disparo MANUAL por lotes de la toma de cadenas de opciones.
#
# El disparo diario lo hace Vercel Cron (vercel.json: 15:00, 16:00 y 17:00
# UTC, lun-vie, ±59 min). Los schedules de GitHub se quitaron: llegaban con
# 5-10 h de retraso y caían siempre con el mercado cerrado.
#
# El endpoint solo acepta días hábiles NYSE de 09:45 al cierre (16:00 ET,
# 13:00 ET en medio día; feriados excluidos) y es idempotente por
# (símbolo, día NY): lanzar esto a mano después de un cron solo reintenta
# los símbolos que falten.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Saltar la ventana de mercado (solo pruebas; el control de calidad sigue activo)'
        required: false
        default: false
        type: boolean

concurrency:
  group: cron-option-chains
  cancel-in-progress: false

jobs:
  option-chains:
    name: Loop /api/cron/option-chains
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Iterar batches de option chains
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT:    https://wall-livid.vercel.app/api/cron/option-chains
          BATCH_SIZE:  '40'
          FORCE:       ${{ inputs.force && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then echo "::error::CRON_SECRET no configurado"; exit 1; fi
          # Un solo taken_at para todos los lotes de esta corrida.
          TAKEN_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "taken_at=$TAKEN_AT · NY ahora: $(TZ=America/New_York date +%H:%M)"
          BATCH_START=0; N=0
          while true; do
            N=$((N+1))
            URL="${ENDPOINT}?batch_start=${BATCH_START}&batch_size=${BATCH_SIZE}&taken_at=${TAKEN_AT}"
            if [ "$FORCE" = "1" ]; then URL="${URL}&force=1"; fi
            STATUS=$(curl -sS -X GET "$URL" -H "Authorization: Bearer $CRON_SECRET" \
              -H "User-Agent: gha-option-chains" --max-time 320 -o /tmp/o.json -w "%{http_code}")
            echo "Batch #$N HTTP $STATUS"; cat /tmp/o.json; echo
            if [ "$STATUS" != "200" ]; then echo "::error::batch #$N falló"; exit 1; fi
            SKIPPED=$(grep -o '"skipped":"[a-z_]*"' /tmp/o.json | head -1 | cut -d'"' -f4 || true)
            if [ -n "$SKIPPED" ]; then
              echo "::notice::mercado cerrado ($SKIPPED) — no se toma la cadena"; break
            fi
            DONE=$(grep -o '"done":[a-z]*' /tmp/o.json | head -1 | cut -d: -f2)
            NEXT=$(grep -o '"next_batch_start":[0-9]*' /tmp/o.json | head -1 | cut -d: -f2)
            if [ "$DONE" = "true" ]; then echo "✓ option chains completas"; break; fi
            if [ -z "$NEXT" ]; then echo "::warning::sin next; corto"; break; fi
            BATCH_START=$NEXT; sleep 8
          done
